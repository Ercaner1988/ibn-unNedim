[workspace]
members = [".", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Ercaner1988/ibn-unNedim"

[workspace.dependencies]
bge-settings = { path = "crates/bge-settings" }
bge-connectors = { path = "crates/bge-connectors" }
bge-theme = { path = "crates/bge-theme" }
bge-gui = { path = "crates/bge-gui" }
bge-clients = { path = "crates/bge-clients" }
arkaplan-politika = { path = "crates/arkaplan-politika" }
bge-arkaplan-sekme = { path = "crates/bge-arkaplan-sekme" }
# Ortak tema (Kilim paleti, Semerkant kâğıdı, kilim çerçeve). git + rev: kardeş
# depo yolu klonlayan herkeste ve CI'da yok. Tema değişince rev'i güncelle.
kilim-tema = { git = "https://github.com/Ercaner1988/kilim-tema", rev = "463ff671b548fb976610248a6569d8975caa5a66" }
# Seçimlik tema kataloğu (el-Fihrist): tema yalnız kullanıcı Tema menüsünden değiştirirken
# sorulur. Aynı kilim-tema rev'ini çeker; ikisi birlikte güncellenir.
fihrist-tema = { git = "https://github.com/Ercaner1988/el-Fihrist", rev = "a67225c5d94c7a8c9ab97e4e64a8c1969eb94aea" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ureq (blocking, rustls): already resolved transitively via hf-hub's sync
# feature (see Cargo.lock), so pulling it in directly adds no new crate to
# the tree, just a Cargo.toml entry - much smaller than pulling reqwest+tokio
# machinery onto a plain std::thread for a couple of short-lived GET/POST
# probes. tls-rustls avoids native-tls/OpenSSL; json for serde_json bodies.
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
# default-features off: glow (OpenGL) blanks to a black window on some
# Windows 11 + AMD/Intel-integrated-GPU combinations (Wgl sRGB swap-chain
# mismatch with DWM - el-fihrist kural 9037960d582ebfe7). wgpu is used instead:
# Vulkan first, DX12 only if no Vulkan adapter (src/main.rs `wgpu_ayari`; AMD's
# DX12 shader compiler amdxc64 burns ~140 s of CPU at every start).
# NOTE: wgpu's DX12 backend previously pulled `windows` 0.62 while another
# dependency in this graph pinned `windows-core` 0.58 (E0277, "multiple
# different versions of crate `windows`") - re-check this if bumping eframe
# ever reintroduces that conflict.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[package]
name = "ibnun-nedim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "İbnü'n-Nedîm Gömme: single-file, pure-Rust bge-m3 embedding server with an OpenAI-compatible API"
repository.workspace = true

build = "build.rs"
[dependencies]
bge-settings.workspace = true
bge-clients.workspace = true
bge-theme.workspace = true
bge-gui.workspace = true
eframe.workspace = true
rayon = "1"
# f16 ağırlık saklama (F16C dönüşümü); candle zaten çekiyor, ağaca yeni crate eklemez.
half = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
hf-hub = { version = "0.4", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
# Vulkan yoklaması (wgpu bağdaştırıcı sayımı eşzamansız); ağaçta zaten var, yeni crate eklemez.
pollster = "1"

[dev-dependencies]
arkaplan-politika.workspace = true

[features]
# Tema menüsüne el-Fihrist kataloğunu ekler; kapalıyken yalnız yerleşik tema var.
fihrist = ["bge-gui/fihrist"]

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Windows .exe icon (assets/ikon.ico) via a resource file; no-op elsewhere.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
